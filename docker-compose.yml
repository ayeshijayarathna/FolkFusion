services:
  mongodb:
    image: mongo:7
    container_name: folkfusion-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: folkfusion
    volumes:
      - mongodb_data:/data/db
    networks:
      - folkfusion-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: folkfusion-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/folkfusion?authSource=admin
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - folkfusion-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: folkfusion-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - folkfusion-network

volumes:
  mongodb_data:

networks:
  folkfusion-network:
    driver: bridge
